# data/*.json 이 push 되면 통합 대시보드를 다시 빌드해 GitHub Pages 로 배포한다.
# 최초 1회: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 지정해야 한다.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:   # Actions 탭에서 수동 실행

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 한다. 진행 중인 배포는 취소하지 않고 순서대로 실행 (어중간한 상태 방지)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main

      # 렌더러가 깨진 채로 배포되는 것을 막는다
      - name: 테스트
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # 잘못된 JSON 은 build_site.py 가 건너뛰고 이유만 출력한다 (한 사람 때문에 전체가 막히지 않는다)
      - name: 대시보드 빌드
        run: python3 scripts/build_site.py --out _site --repo-url "https://github.com/${{ github.repository }}"

      - uses: actions/configure-pages@main
        with:
          enablement: true   # Pages 가 꺼져 있으면 켜본다. 권한이 없으면 수동 설정 필요

      - uses: actions/upload-pages-artifact@main
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@main
